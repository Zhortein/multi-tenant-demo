zhortein_multi_tenant:
    # Tenant entity configuration
    tenant_entity: 'App\Entity\Tenant'
    
    # Tenant resolution strategy (path, subdomain, or header)
    resolver: 'path'
    
    # Database configuration
    database:
        strategy: 'shared_db'  # shared database with tenant filtering
        enable_filter: true    # enable automatic tenant filtering
        auto_tenant_id: true   # automatically add tenant_id to entities

    # The reference application explicitly enables the RC4-compatible Symfony pool decorator.
    decorators:
        cache:
            enabled: true
            services: ['cache.app']

    # Tenant-aware public integrations fail closed and expose no email metadata by default.
    mailer:
        enabled: true
        add_tenant_id_header: false
        add_tenant_name_header: false

    storage:
        enabled: true
        type: 'local'
        local:
            base_path: '%kernel.project_dir%/var/uploads'
            base_url: '/tenant-files'
