doctrine:
    dbal:
        # SQL parameters contain serialized references and Messenger payloads.
        logging: false
        profiling: false

framework:
    messenger:
        transports:
            object_storage_probe:
                dsn: 'doctrine://default?queue_name=object_storage_probe&auto_setup=false'
                retry_strategy:
                    max_retries: 0
        routing:
            App\Tests\Fixtures\ObjectStorage\ReadStoredObjectMessage: object_storage_probe

# RC12 is explicitly enabled for the existing executable storage demonstration.
# Production/default compilation keeps audit disabled and needs no audit key.
services:
    app.object_storage.audit_codec:
        class: Zhortein\MultiTenantBundle\ObjectStorage\ObjectStorageAuditCodec
        arguments:
            $activeKey: current
            $keys:
                current: '%env(file:OBJECT_AUDIT_KEY_FILE)%'

zhortein_multi_tenant:
    object_storage:
        audit:
            enabled: true
            codec: app.object_storage.audit_codec
