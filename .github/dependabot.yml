version: 2

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      compatible-non-breaking-updates:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: zhortein/multi-tenant-bundle
        versions:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      compatible-non-breaking-updates:
        update-types:
          - minor
          - patch
